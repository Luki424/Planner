name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Nur ein Deployment gleichzeitig; laufende dürfen fertig werden.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint
      - run: npm test
      - run: npx tsc --noEmit -p tsconfig.app.json

      - name: Build
        env:
          # Die App liegt unter https://<konto>.github.io/<repo>/
          VITE_BASE: /${{ github.event.repository.name }}/
          # Optional: unter Settings → Variables hinterlegte Firebase-Werte.
          # Fehlen sie, trägt man die Verbindung in der App selbst ein.
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
        run: npm run build

      # Pages liefert keine Fallback-Route: ein Aufruf von /Planner/irgendwas
      # bekäme sonst 404 statt der App.
      - name: 404 auf die App zeigen lassen
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5
        with:
          # Schaltet Pages beim ersten Lauf selbst frei, statt es in den
          # Repository-Einstellungen von Hand zu verlangen.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
